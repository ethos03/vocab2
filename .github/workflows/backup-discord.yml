name: Backup Discord

on:
  push:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer les fichiers sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_BACKUP_WEBHOOK }}
          MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          DATE=$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')
          zip -r backup.zip . -x ".git/*" "node_modules/*" ".github/*"
          curl -sS -F "payload_json={\"content\":\"💾 **Sauvegarde** ${DATE}\n\`${SHA:0:7}\` : ${MSG//\"/\\\"}\"}" \
               -F "file=@backup.zip;filename=backup-${SHA:0:7}.zip" \
               "$WEBHOOK"
               on:
  push:
    branches: [main]

jobs:
  backup:
    if: "!contains(github.event.head_commit.message, 'Rename') && !contains(github.event.head_commit.message, 'rename')"
    runs-on: ubuntu-latest
