<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roue des mots</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1f2522;--muted:#68716b;--line:#dcd8ce;--accent:#e7833f;--accent2:#1d6b5d;--soft:#eef4f0;--shadow:0 18px 50px #28372c18}
body.dark{--bg:#151917;--panel:#202522;--ink:#f2f0e9;--muted:#a8b0a9;--line:#3a443e;--soft:#29352f;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-sans-serif,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
header{display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:auto;padding:28px 28px 10px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:39px;height:39px;border-radius:13px 13px 13px 3px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;transform:rotate(-8deg)}
h1{font:700 clamp(22px,3vw,34px)/1 Georgia,serif;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.iconbtn,.tab{background:transparent;color:var(--muted);padding:9px 12px;border-radius:11px}
.iconbtn:hover,.tab:hover{background:var(--soft);color:var(--ink)}
main{max-width:1300px;margin:auto;padding:18px 28px 60px}
.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab.active{color:var(--ink);background:var(--soft);font-weight:700}
.view{display:none}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:800;margin:0 0 13px}
.field{margin:13px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);outline:none}
.field textarea{min-height:78px;resize:vertical}
.primary{background:var(--accent);color:white;padding:12px 17px;border-radius:12px;font-weight:800;width:100%}
.secondary{background:var(--soft);color:var(--ink);padding:10px 13px;border-radius:11px}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px}
.listhead h2{font:700 21px Georgia,serif;margin:0}
.empty{padding:35px 10px;color:var(--muted);text-align:center}
.admin-only{display:none}
.is-admin .admin-only{display:block}
.admin-inline{display:none}
.is-admin .admin-inline{display:inline-flex}

/* chapitres */
.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.chapcard{padding:20px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--ink);transition:.15s}
.chapcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.chapcard .name{font:700 19px Georgia,serif}
.chapcard .nb{color:var(--muted);font-size:13px;margin-top:6px}
.chapcard.all{background:var(--soft);border-style:dashed}

/* page d'un chapitre */
.layout{display:grid;grid-template-columns:minmax(340px,1fr) 340px;gap:20px}
.backbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.backbar h2{font:700 26px Georgia,serif;margin:0}
.wheelstage{min-height:520px;display:grid;place-items:center;overflow:hidden;position:relative}
.wheelwrap{display:grid;place-items:center;position:relative}
.wheel{width:min(80vw,360px);height:min(80vw,360px);border-radius:50%;border:12px solid var(--panel);box-shadow:0 23px 45px #26392b2b,0 0 0 1px var(--line);transition:transform 3.6s cubic-bezier(.12,.72,.14,1)}
.pointer{position:absolute;top:-12px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:25px solid var(--ink);z-index:2}
.spin{position:absolute;border-radius:50%;width:104px;height:104px;background:var(--ink);color:var(--bg);font-weight:900;letter-spacing:.12em;box-shadow:0 10px 25px #0004}
.spin:disabled{opacity:.6}
.question{margin-top:18px;padding:18px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.question[hidden]{display:none}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qword{font:700 25px Georgia,serif}
.speak{background:transparent;color:var(--accent);font-size:18px;padding:2px 5px}
.answer{display:flex;gap:8px;margin-top:13px}
.answer input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.answer button{padding:0 16px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:700}
.result{margin:12px 0 0;font-weight:700}
.good{color:#24805c}
.bad{color:#bd4c42}
.list{padding:21px}
.wordlist{display:grid;gap:10px;max-height:560px;overflow:auto}
.worditem{padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--bg)}
.wline{display:flex;justify-content:space-between;gap:8px}
.en{font:700 19px Georgia,serif}
.fr{color:var(--accent2);margin-top:3px}
.meta{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5}

/* autres onglets */
.subview{max-width:860px;margin:auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.eval{padding:16px;border:1px solid var(--line);border-radius:14px;margin:9px 0;background:var(--panel)}
.eval h3{margin:0 0 5px;font:700 18px Georgia,serif}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.statcard{padding:20px}
.statcard h2{margin:0 0 15px;font:700 21px Georgia,serif}
.bar{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:12px 0;font-size:12px}
.barline{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.barline i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:10}
.modal[hidden]{display:none}
.modal .card{width:min(410px,100%);padding:24px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;display:none;z-index:20}
.toast.show{display:block}

@media(max-width:900px){.layout{display:block}.list{margin-top:16px}.formgrid,.statgrid{grid-template-columns:1fr}.answer{display:block}.answer button{padding:11px;width:100%;margin-top:8px}header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">↗</div>
    <div>
      <h1>Roue des mots</h1>
      <div class="sub">anglais · français · par chapitre</div>
    </div>
  </div>
  <div>
    <button class="iconbtn" id="themeBtn">☼ / ☾</button>
    <button class="iconbtn" id="adminBtn">Admin</button>
  </div>
</header>

<main>
  <nav class="tabs">
    <button class="tab active" data-view="chapitres">Chapitres</button>
    <button class="tab" data-view="evaluations">Éval</button>
    <button class="tab" data-view="stats">Stats</button>
  </nav>

  <!-- ONGLET CHAPITRES : liste des chapitres -->
  <section class="view active" id="chapitres">
    <div id="chapList">
      <div class="listhead"><h2>Mes chapitres</h2><span class="small" id="totalCount"></span></div>
      <div class="chapgrid" id="chapGrid"></div>

      <div class="admin-only card" style="padding:22px;margin-top:24px;max-width:480px">
        <p class="eyebrow">Ajouter un mot</p>
        <form id="wordForm">
          <div class="field"><label>Chapitre *</label>
            <input name="chapter" id="chapInput" list="chapNames" required placeholder="Ex : Unit 1">
            <datalist id="chapNames"></datalist>
          </div>
          <div class="field"><label>Anglais *</label><input name="english" required></div>
          <div class="field"><label>Français *</label><input name="translation" required></div>
          <div class="field"><label>Synonyme (optionnel)</label><input name="synonym"></div>
          <div class="field"><label>Contraire (optionnel)</label><input name="antonym"></div>
          <button class="primary">Ajouter le mot</button>
        </form>
      </div>
    </div>

    <!-- Page d'un chapitre -->
    <div id="chapPage" hidden>
      <div class="backbar">
        <button class="secondary" id="backBtn">← Chapitres</button>
        <h2 id="chapTitle"></h2>
        <button class="secondary admin-only" id="deleteChapterBtn" type="button">Supprimer le chapitre</button>
        <select id="mode" style="padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)">
          <option value="mixed">Mixte</option>
          <option value="en-fr">Anglais → Français</option>
          <option value="fr-en">Français → Anglais</option>
        </select>
      </div>

      <div class="layout">
        <section class="card" style="padding:20px">
          <div class="wheelstage">
            <div class="wheelwrap">
              <div class="pointer"></div>
              <div class="wheel" id="wheel" role="button" tabindex="0"></div>
              <button class="spin" id="spin">SPIN</button>
            </div>
          </div>
          <div class="question" id="question" hidden>
            <div class="qtop">
              <div>
                <div class="eyebrow">À toi</div>
                <div class="qword" id="qword"></div>
              </div>
              <button class="speak" id="qSpeak">🔊</button>
            </div>
            <div class="small" id="qhint"></div>
            <form class="answer" id="answerForm">
              <input id="answer" autocomplete="off" placeholder="Ta réponse…" required>
              <button>Corriger</button>
            </form>
            <div class="result" id="result"></div>
          </div>
        </section>

        <aside class="card list">
          <div class="listhead"><h2>Mots du chapitre</h2><span class="small" id="count"></span></div>
          <div class="wordlist" id="wordlist"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ONGLET EVAL -->
  <section class="view subview" id="evaluations">
    <div class="card" style="padding:22px">
      <div class="listhead">
        <div>
          <p class="eyebrow">Repères partagés</p>
          <h2 style="font:700 28px Georgia,serif;margin:0">Évaluations passées</h2>
        </div>
      </div>
      <div class="admin-only">
        <form id="evalForm" class="formgrid">
          <div class="field"><label>Nom *</label><input name="name" required placeholder="Contrôle chapitre 2"></div>
          <div class="field"><label>Date *</label><input name="date" type="date" required></div>
          <div class="field" style="grid-column:1/-1"><label>Mots présents (séparés par des virgules)</label><textarea name="words" required></textarea></div>
          <button class="primary" style="grid-column:1/-1">Publier l’évaluation</button>
        </form>
      </div>
      <div id="evalList" style="margin-top:20px"></div>
    </div>
  </section>

  <!-- ONGLET STATS -->
  <section class="view subview" id="stats">
    <div class="statgrid">
      <div class="card statcard"><p class="eyebrow">Perso</p><h2>Les plus ratés</h2><div id="badStats"></div></div>
      <div class="card statcard"><p class="eyebrow">Perso</p><h2>Les plus réussis</h2><div id="goodStats"></div></div>
    </div>
    <p class="small" style="margin:16px">Ces stats sont propres à cette machine (stockées dans le navigateur).</p>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="card">
    <div class="listhead"><h2>Connexion admin</h2><button class="iconbtn" id="closeModal">×</button></div>
    <form id="loginForm">
      <div class="field"><label>Mot de passe</label><input type="password" name="password" required></div>
      <button class="primary">Se connecter</button>
      <p class="result" id="loginMsg"></p>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],API='/api';
const ALL='__all__';
let words=[],evals=[],current=null,spinning=false,rotation=0,openChap=null;
const localKey='roue-stats-v1',tokenKey='roue-admin-token';
let stats=JSON.parse(localStorage.getItem(localKey)||'{}');

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').replace(/\s+/g,' ').trim().replace(/^(to|the|a|an|le|la|les|l'|un|une|des)\s+/,'');
const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}return d[m][n]};
const isMatch=(inp,acc)=>acc.some(a=>a&&(inp===a||(a.length>3&&lev(inp,a)<=(a.length>7?2:1))));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const chapOf=w=>(w.chapter&&w.chapter.trim())||'Sans chapitre';
const isAdmin=()=>!!localStorage.getItem(tokenKey);

function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400)}
function speak(text,lang){if(!('speechSynthesis'in window))return toast('Audio non dispo');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;speechSynthesis.speak(u)}

async function api(url,opt={}){
  const h={'Content-Type':'application/json'};
  if(localStorage.getItem(tokenKey))h.Authorization='Bearer '+localStorage.getItem(tokenKey);
  const r=await fetch(API+url,{...opt,headers:h});
  if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Erreur');
  return r.json();
}

async function load(){
  try{words=await api('/words')}catch{words=[]}
  try{evals=await api('/evaluations')}catch{evals=[]}
  renderChapters();renderEvals();renderStats();
  if(openChap)renderChapterPage();
}

/* ---------- Chapitres ---------- */
function chapterNames(){
  return [...new Set(words.map(chapOf))].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
}
function wordsOf(chap){return chap===ALL?words:words.filter(w=>chapOf(w)===chap)}

function renderChapters(){
  const names=chapterNames();
  $('#totalCount').textContent=words.length+' mots · '+names.length+' chapitre'+(names.length>1?'s':'');
  let html='';
  if(words.length)html+=`<button class="chapcard all" data-chap="${ALL}"><div class="name">🎡 Tous les chapitres</div><div class="nb">${words.length} mots mélangés</div></button>`;
  html+=names.map(n=>`<button class="chapcard" data-chap="${esc(n)}"><div class="name">${esc(n)}</div><div class="nb">${wordsOf(n).length} mot${wordsOf(n).length>1?'s':''}</div></button>`).join('');
  $('#chapGrid').innerHTML=html||'<div class="empty">Aucun chapitre pour l’instant.<br>L’admin peut ajouter des mots.</div>';
  $('#chapNames').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
  $$('.chapcard').forEach(b=>b.onclick=()=>openChapter(b.dataset.chap));
}

function openChapter(chap){
  openChap=chap;
  $('#chapList').hidden=true;
  $('#chapPage').hidden=false;
  $('#question').hidden=true;
  renderChapterPage();
}
$('#backBtn').onclick=()=>{
  openChap=null;
  $('#chapPage').hidden=true;
  $('#chapList').hidden=false;
};
$('#deleteChapterBtn').onclick=async()=>{
  const chap=openChap;
  if(!isAdmin()||!chap||chap===ALL)return;
  if(!confirm(`Supprimer le chapitre « ${chap} » et tous ses mots ?`))return;
  try{
    await api('/chapters/'+encodeURIComponent(chap),{method:'DELETE'});
    openChap=null;
    $('#chapPage').hidden=true;
    $('#chapList').hidden=false;
    await load();
    toast('Chapitre supprimé');
  }catch(err){
    toast(err.message);
  }
};
  
function renderChapterPage(){
  const list=wordsOf(openChap);
  $('#chapTitle').textContent=openChap===ALL?'Tous les chapitres':openChap;
  $('#count').textContent=list.length+' mot'+(list.length>1?'s':'');
  $('#deleteChapterBtn').style.display=isAdmin()&&openChap!==ALL?'inline-flex':'none';
  $('#wordlist').innerHTML=list.length?list.map(w=>`<article class="worditem"><div class="wline"><div><div class="en">${esc(w.english)}</div><div class="fr">→ ${esc(w.translation)}</div></div><button class="speak" data-speak="${esc(w.id)}">🔊</button></div><div class="meta">${w.synonym?'synonyme · '+esc(w.synonym)+' · ':''}${w.antonym?'contraire · '+esc(w.antonym):''}${openChap===ALL?'<br>📁 '+esc(chapOf(w)):''}${isAdmin()?`<br><button class="admin-inline secondary" data-delete="${esc(w.id)}" style="margin-top:8px;padding:5px 8px">Supprimer</button>`:''}</div></article>`).join(''):'<div class="empty">Ce chapitre est vide.</div>';
  $$('[data-speak]').forEach(b=>b.onclick=()=>speak(words.find(w=>String(w.id)===b.dataset.speak).english,'en-US'));
  $$('[data-delete]').forEach(b=>b.onclick=async()=>{
    if(confirm('Supprimer ce mot ?')){try{await api('/words/'+b.dataset.delete,{method:'DELETE'});load()}catch(e){toast(e.message)}}
  });
  drawWheel(list.length);
}

/* ---------- Roue (couleurs seulement, lisible même à 75+ mots) ---------- */
function drawWheel(n){
  const w=$('#wheel');
  const colors=['#e7833f','#f2b35c','#5f9f87','#d8dfcd','#cb705e'];
  if(!n){w.style.background='var(--line)';return}
  const parts=[];
  for(let i=0;i<n;i++){
    // évite que deux parts voisines aient la même couleur (dernière part vs première)
    let c=colors[i%colors.length];
    if(i===n-1&&n>1&&c===colors[0])c=colors[2];
    parts.push(`${c} ${i*360/n}deg ${(i+1)*360/n}deg`);
  }
  w.style.background=`conic-gradient(${parts.join(',')})`;
}

/* ---------- Questions ---------- */
function showQuestion(w){
  const mode=$('#mode').value==='mixed'?(Math.random()<.5?'en-fr':'fr-en'):$('#mode').value;
  let prompt;
  if(mode==='fr-en'){
    prompt='Quel est le mot anglais ?';
    current={w,accepted:[norm(w.english)]};
    $('#qword').textContent=w.translation;
    $('#qSpeak').onclick=()=>speak(w.translation,'fr-FR');
  }else{
    const opts=['translation'];
    if(w.synonym)opts.push('synonym');
    if(w.antonym)opts.push('antonym');
    const key=opts[Math.floor(Math.random()*opts.length)];
    prompt=key==='translation'?'Donne la traduction française.':key==='synonym'?'Donne un synonyme.':'Donne le contraire.';
    current={w,accepted:String(w[key]).split(/[;,|/]/).map(norm)};
    $('#qword').textContent=w.english;
    $('#qSpeak').onclick=()=>speak(w.english,'en-US');
  }
  $('#qhint').textContent=prompt;
  $('#question').hidden=false;
  $('#result').textContent='';
  $('#result').className='result';
  $('#answer').value='';
  $('#answer').focus();
}

function spin(){
  const list=wordsOf(openChap);
  if(spinning)return;
  if(!list.length)return toast('Chapitre vide');
  spinning=true;
  $('#question').hidden=true;
  $('#spin').disabled=true;
  const n=list.length,i=Math.floor(Math.random()*n);
  const target=360-((i+.5)*360/n);
  rotation+=1440+(((target-(rotation%360))+360)%360);
  $('#wheel').style.transform=`rotate(${rotation}deg)`;
  setTimeout(()=>{
    spinning=false;
    $('#spin').disabled=false;
    showQuestion(list[i]);
  },3650);
}
$('#spin').onclick=spin;
$('#wheel').onclick=spin;
$('#wheel').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin()}};

$('#answerForm').onsubmit=e=>{
  e.preventDefault();
  if(!current)return;
  const ok=isMatch(norm($('#answer').value),current.accepted);
  const id=current.w.id;
  stats[id]=stats[id]||{right:0,total:0};
  stats[id].total++;
  if(ok)stats[id].right++;
  localStorage.setItem(localKey,JSON.stringify(stats));
  $('#result').textContent=ok?'Bravo, bonne réponse !':'Raté. Réponse : '+current.accepted.join(' / ');
  $('#result').className='result '+(ok?'good':'bad');
  renderStats();
};

/* ---------- Onglets, thème, admin ---------- */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#'+t.dataset.view).classList.add('active');
});

$('#themeBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('roue-theme',document.body.classList.contains('dark')?'dark':'light');
};
if(localStorage.getItem('roue-theme')==='dark')document.body.classList.add('dark');

$('#adminBtn').onclick=()=>{
  if(!isAdmin()){$('#modal').hidden=false;return}
  document.body.classList.add('is-admin');
  toast('Mode admin activé');
};
$('#closeModal').onclick=()=>$('#modal').hidden=true;

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    const r=await api('/login',{method:'POST',body:JSON.stringify({password:new FormData(e.target).get('password')})});
    localStorage.setItem(tokenKey,r.token);
    $('#modal').hidden=true;
    document.body.classList.add('is-admin');
    load();
    toast('Connexion admin réussie');
  }catch(err){
    $('#loginMsg').textContent=err.message;
    $('#loginMsg').className='result bad';
  }
};

$('#wordForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    const b=Object.fromEntries(new FormData(e.target));
    await api('/words',{method:'POST',body:JSON.stringify(b)});
    const chap=b.chapter;
    e.target.reset();
    $('#chapInput').value=chap; // garde le chapitre pour enchaîner les ajouts
    load();toast('Mot ajouté');
  }catch(err){toast(err.message)}
};

$('#evalForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    await api('/evaluations',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
    e.target.reset();load();toast('Évaluation publiée');
  }catch(err){toast(err.message)}
};

function renderEvals(){
  $('#evalList').innerHTML=evals.length?evals.slice().reverse().map(x=>`<article class="eval"><h3>${esc(x.name)}</h3><div class="small">${esc(x.date)} · ${x.words.length} mot(s)</div><div class="small" style="margin-top:8px">${x.words.map(esc).join(' · ')}</div></article>`).join(''):'<div class="empty">Aucune évaluation.</div>';
}

function renderStats(){
  const a=words.map(w=>{const s=stats[w.id]||{right:0,total:0};return {...w,pct:s.total?Math.round(100*s.right/s.total):0,total:s.total}}).filter(w=>w.total).sort((a,b)=>a.pct-b.pct);
  const make=arr=>arr.length?arr.slice(0,6).map(w=>`<div class="bar"><span>${esc(w.english)}</span><span class="barline"><i style="width:${w.pct}%"></i></span><b>${w.pct}%</b></div>`).join(''):'<div class="empty">Réponds à quelques questions.</div>';
  $('#badStats').innerHTML=make(a);
  $('#goodStats').innerHTML=make(a.slice().reverse());
}

if(isAdmin())document.body.classList.add('is-admin');
load();
})();
</script>
</body>
</html>
